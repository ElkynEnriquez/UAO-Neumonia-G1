[pytest]
# Configuración de pytest para el proyecto

# Directorio donde están los tests
testpaths = test

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones adicionales
addopts = 
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Marcadores personalizados
markers =
    slow: tests que tardan más tiempo
    integration: tests de integración (usan recursos reales)
    unit: tests unitarios con mocks
