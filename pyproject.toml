[project]
name = "uao-neumonia-g1"
version = "0.1.0"
description = "Herramienta para la detección rápida de neumonía mediante Deep Learning"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "numpy>=1.21.0",
    "tensorflow>=2.10.0",
    "opencv-python>=4.5.0",
    "pillow>=9.0.0",
    "pydicom>=2.3.0",
    "tkcap>=0.0.1",
    "img2pdf>=0.4.0",
    "reportlab>=3.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]
